<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pissadakis P.P. — Μάστορας</title>
  <meta name="description" content="Πισσαδάκης P.P. — δουλειά με μεράκι. Δείτε τα έργα μας." />
  <meta name="theme-color" content="#c4000f" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;500;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="loader" id="loader"><img src="assets/logo.png" alt="" /></div>

  <header class="nav">
    <a href="#top" class="nav__brand"><img src="assets/logo.png" alt="Pissadakis P.P." /></a>
    <nav>
      <a href="#projects">Έργα</a>
      <a href="#contact" class="nav__cta">Επικοινωνία</a>
    </nav>
  </header>

  <!-- 3D canvas: fixed behind the hero while it is pinned -->
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="flash" id="flash"></div>

  <main id="top">
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__sticky">
        <div class="hero__bg">
          <div class="hero__glow"></div>
          <div class="hero__grid"></div>
        </div>

        <h1 class="hero__word" id="heroWord" aria-label="Pissadakis">
          <span style="--i:0">P</span><span style="--i:1">I</span><span style="--i:2">S</span><span style="--i:3">S</span><span style="--i:4">A</span><span style="--i:5">D</span><span style="--i:6">A</span><span style="--i:7">K</span><span style="--i:8">I</span><span style="--i:9">S</span>
        </h1>

        <div class="hero__copy hero__copy--left" id="copyLeft">
          <span class="kicker">Ο μάστορας</span>
          <p>Δουλειά με χέρια,<br />μεράκι και υπογραφή.</p>
        </div>
        <div class="hero__copy hero__copy--right" id="copyRight">
          <span class="kicker">P.P.</span>
          <p>Κάθε έργο<br />με το όνομά μας πάνω του.</p>
        </div>

        <div class="hero__scroll" id="scrollHint">
          <span>Scroll</span>
          <i></i>
        </div>
      </div>
    </section>

    <!-- PROJECTS: 3D fly-through -->
    <section class="projects" id="projects">
      <div class="projects__sticky">
        <div class="projects__head">
          <span class="kicker">Επιλεγμένα</span>
          <h2>Έργα</h2>
          <div class="projects__counter"><b id="projNow">01</b> / <span id="projTotal">00</span></div>
        </div>
        <div class="tunnel" id="tunnel">
          <div class="tunnel__world" id="world"></div>
        </div>
        <div class="projects__bar"><i id="projBar"></i></div>
      </div>
    </section>

    <!-- GRID of all projects -->
    <section class="gallery" id="gallery">
      <h2 class="gallery__title">Όλα τα έργα</h2>
      <div class="gallery__grid" id="grid"></div>
    </section>

    <!-- CONTACT -->
    <section class="contact" id="contact">
      <img class="contact__logo" src="assets/logo.png" alt="" />
      <h2>Έχετε ένα έργο;<br /><em>Πάμε να το φτιάξουμε.</em></h2>
      <div class="contact__actions">
        <a class="btn btn--yellow" href="tel:+30XXXXXXXXXX">Καλέστε μας</a>
        <a class="btn btn--ghost" href="mailto:info@example.com">Στείλτε email</a>
      </div>
      <footer>© <span id="year"></span> Pissadakis P.P.</footer>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" aria-label="Κλείσιμο">×</button>
    <img alt="" />
    <p></p>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="js/projects.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
